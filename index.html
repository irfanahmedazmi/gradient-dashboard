<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradient Cyber Dashboard</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #111827;
    --panel-alt: #1f2937;
    --accent: #00d4ff;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --green: #22c55e;
    --amber: #f59e0b;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
  }

  .sidebar {
    width: 220px;
    background: var(--panel);
    padding: 28px 20px;
    position: fixed;
    height: 100vh;
  }

  .sidebar h1 {
    font-size: 16px;
    letter-spacing: 0.5px;
    color: var(--accent);
    margin-bottom: 32px;
  }

  .sidebar nav a {
    display: block;
    padding: 10px 12px;
    margin-bottom: 4px;
    border-radius: 8px;
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
  }

  .sidebar nav a.active {
    background: var(--panel-alt);
    color: var(--accent);
  }

  .main {
    margin-left: 220px;
    padding: 32px 36px;
    width: 100%;
  }

  .main > h1 {
    font-size: 22px;
    margin-bottom: 4px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 24px;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }

  .card {
    background: var(--panel);
    padding: 18px 20px;
    border-radius: 12px;
  }

  .card .num {
    font-size: 26px;
    font-weight: 700;
    color: var(--accent);
  }

  .card .label {
    color: var(--muted);
    font-size: 12.5px;
    margin-top: 4px;
  }

  .layout {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 20px;
  }

  .list {
    background: var(--panel);
    border-radius: 12px;
    padding: 10px;
    height: fit-content;
  }

  .list .item {
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 6px;
    cursor: pointer;
    font-size: 14px;
  }

  .list .item:hover {
    background: var(--panel-alt);
  }

  .list .item.selected {
    background: var(--accent);
    color: #04202b;
    font-weight: 600;
  }

  .detail {
    background: var(--panel);
    border-radius: 12px;
    padding: 26px 28px;
  }

  .detail h2 {
    color: var(--accent);
    margin-bottom: 16px;
  }

  .meta {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    margin-bottom: 22px;
    font-size: 14px;
  }

  .meta span {
    color: var(--muted);
  }

  .meta strong {
    color: var(--text);
  }

  .detail h3 {
    font-size: 13px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }

  .timeline-item {
    padding: 11px 14px;
    background: var(--panel-alt);
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 14px;
  }

  .done { color: var(--green); }
  .progress { color: var(--amber); }
  .pending { color: var(--muted); }

  @media (max-width: 800px) {
    .sidebar { position: static; width: 100%; height: auto; padding: 18px 20px; }
    .main { margin-left: 0; padding: 24px; }
    .layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="sidebar">
  <h1>GRADIENT CYBER</h1>
  <nav>
    <a href="#" class="active">Dashboard</a>
    <a href="#">Customers</a>
    <a href="#">Projects</a>
    <a href="#">Reports</a>
    <a href="#">Analytics</a>
    <a href="#">Settings</a>
  </nav>
</div>

<div class="main">
  <h1>Internal Operations Dashboard</h1>
  <div class="subtitle">Phase 1 — sample data, no login yet</div>

  <div class="cards" id="cards"></div>

  <div class="layout">
    <div class="list" id="customerList"></div>
    <div class="detail" id="customerDetail"></div>
  </div>
</div>

<script>
  // ---- DATA ----
  // To add a new customer: copy one object below, edit the fields, add a comma after it.
  // Nothing else in this file needs to change.
  const customers = [
    {
      id: "c01",
      name: "Customer 01",
      plan: "Managed Security",
      status: "Active",
      engineer: "Assigned",
      timeline: [
        { label: "AR Call Completed", state: "done" },
        { label: "Engineering Tasks Completed", state: "done" },
        { label: "Cloud Tasks In Progress", state: "progress" },
        { label: "Penetration Test Pending", state: "pending" },
        { label: "IT Outbrief Pending", state: "pending" }
      ]
    },
    {
      id: "c02",
      name: "Customer 02",
      plan: "Managed Detection & Response",
      status: "Onboarding",
      engineer: "Unassigned",
      timeline: [
        { label: "AR Call Completed", state: "done" },
        { label: "Engineering Tasks In Progress", state: "progress" },
        { label: "Cloud Tasks Pending", state: "pending" },
        { label: "Penetration Test Pending", state: "pending" },
        { label: "IT Outbrief Pending", state: "pending" }
      ]
    },
    {
      id: "c03",
      name: "Customer 03",
      plan: "Managed Security",
      status: "At Risk",
      engineer: "Assigned",
      timeline: [
        { label: "AR Call Completed", state: "done" },
        { label: "Engineering Tasks Completed", state: "done" },
        { label: "Cloud Tasks Completed", state: "done" },
        { label: "Penetration Test In Progress", state: "progress" },
        { label: "IT Outbrief Pending", state: "pending" }
      ]
    }
  ];

  const icons = { done: "✅", progress: "🔄", pending: "⏳" };

  function renderCards() {
    const active = customers.filter(c => c.status === "Active").length;
    const atRisk = customers.filter(c => c.status === "At Risk").length;
    const milestonesDone = customers.reduce(
      (sum, c) => sum + c.timeline.filter(t => t.state === "done").length,
      0
    );

    document.getElementById("cards").innerHTML = `
      <div class="card"><div class="num">${customers.length}</div><div class="label">Total Customers</div></div>
      <div class="card"><div class="num">${active}</div><div class="label">Active</div></div>
      <div class="card"><div class="num">${atRisk}</div><div class="label">At Risk</div></div>
      <div class="card"><div class="num">${milestonesDone}</div><div class="label">Milestones Completed</div></div>
    `;
  }

  function renderList(selectedId) {
    document.getElementById("customerList").innerHTML = customers
      .map(c => `<div class="item ${c.id === selectedId ? "selected" : ""}" onclick="selectCustomer('${c.id}')">${c.name}</div>`)
      .join("");
  }

  function renderDetail(c) {
    document.getElementById("customerDetail").innerHTML = `
      <h2>${c.name}</h2>
      <div class="meta">
        <span><strong>Plan:</strong> ${c.plan}</span>
        <span><strong>Status:</strong> ${c.status}</span>
        <span><strong>Engineer:</strong> ${c.engineer}</span>
      </div>
      <h3>Project Timeline</h3>
      ${c.timeline.map(t => `<div class="timeline-item ${t.state}">${icons[t.state]} ${t.label}</div>`).join("")}
    `;
  }

  function selectCustomer(id) {
    const c = customers.find(x => x.id === id);
    renderList(id);
    renderDetail(c);
  }

  renderCards();
  renderList(customers[0].id);
  renderDetail(customers[0]);
</script>

</body>
</html>
